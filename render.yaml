# Render Blueprint — creates both services with the correct settings.
# In Render: New + → Blueprint → connect this repo.
services:
  - type: web
    name: hostelhub-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/db-test

staticSites:
  - name: hostelhub-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
